{# Error toast bubble - included by base.html for each Django error message. #}
<div class="pointer-events-auto flex w-full max-w-md items-center gap-3 rounded-2xl bg-rose-600 px-4 py-3 text-sm font-medium text-white shadow-xl" role="alert">
    <span aria-hidden="true" class="shrink-0 text-base">❌</span>
    <p class="min-w-0 flex-1">{{ message }}</p>
    <button type="button" aria-label="Dismiss notification" onclick="this.parentElement.remove()"
            class="shrink-0 rounded-full p-1 text-white/70 transition hover:bg-white/10 hover:text-white">✕</button>
</div>
