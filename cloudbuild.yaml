# Cloud Build pipeline for the GitHub trigger: gate on the tests, build AND push
# one image, then point the web service and the scheduled jobs at it.
#
# No secret lives here on purpose. `gcloud run deploy` and `gcloud run jobs
# update` only change the image, so the environment variables, scaling limits and
# probes configured in the console are preserved. Never add them to this file.
#
# The Dockerfile stays the single source of truth for the image: this pipeline
# does not duplicate any of its steps.
#
# It is idempotent and safe on a *first* run: the registry repository is created
# on demand, and the two deploy steps only touch a service or a job that already
# exists, so the first build just produces the image and the logs say what to
# create from the console.
#
# Deploying to another region? Change _REGION below: it must match the Artifact
# Registry repository and the Cloud Run service.

substitutions:
  _REGION: europe-west1
  _SERVICE: barkai
  _REPOSITORY: barkai
  _MAINTENANCE_JOB: barkai-maintenance
  _RETENTION_JOB: barkai-retention

# A cold build (pip install + tests on SQLite + image build) needs room: the
# trigger default of 10 minutes is too tight.
timeout: 1200s

steps:
  # 1) Deploy gate. GitHub Actions already runs the suite for pull-request
  #    feedback; this step is what protects *production*, because a red CI run
  #    does not stop the Cloud Build trigger.
  - id: test
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --no-cache-dir -r requirements.txt
        python scripts/compile_messages.py
        python manage.py eval_agent --check-only
        python manage.py test chat

  # 2) The Artifact Registry repository. Nothing else creates it, and a push to a
  #    repository that does not exist fails with a `denied` error that says
  #    nothing about the real cause -- the classic first-run trap. Same idempotent
  #    contract as the deploy steps below: create it if it is missing, otherwise
  #    say so and move on. Needs `artifactregistry.repositories.create` on the
  #    Cloud Build service account (the Artifact Registry Admin role); without it
  #    this step fails and you create the repository once by hand instead.
  - id: prepare-registry
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if gcloud artifacts repositories describe ${_REPOSITORY} \
             --location=${_REGION} >/dev/null 2>&1; then
          echo "Artifact Registry repository '${_REPOSITORY}' already exists in ${_REGION}."
        else
          gcloud artifacts repositories create ${_REPOSITORY} \
            --repository-format=docker \
            --location=${_REGION} \
            --description="barkAI images, built by the Cloud Build trigger"
        fi

  # 3) Build and push, in this order and inside this step. The push cannot be left
  #    to an `images:` block at the bottom of this file: Cloud Build pushes those
  #    only after the *whole* build has succeeded, so `deploy-service` below would
  #    look for a tag the registry does not have yet -- and because that step fails,
  #    the push would never run either. A deadlock: a fresh tag could never be
  #    deployed. That was B-007. Both tags are pushed so `:latest` stays usable for
  #    a manual console deploy. A literal `$` for the shell is written `$$` (see the
  #    note in step 5).
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}
        docker build -t "$$IMAGE:$SHORT_SHA" -t "$$IMAGE:latest" .
        docker push "$$IMAGE:$SHORT_SHA"
        docker push "$$IMAGE:latest"

  # 4) The web service. It is UPDATED only: on a first run the service does not
  #    exist yet and `gcloud run deploy` would happily CREATE it -- without any
  #    environment variable (so DEBUG=True on SQLite) and, with no
  #    --allow-unauthenticated flag, unreachable. That misconfiguration is worse
  #    than a skipped step, so the service is left to the console and this step
  #    just reports it.
  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
        if gcloud run services describe ${_SERVICE} --region=${_REGION} >/dev/null 2>&1; then
          gcloud run deploy ${_SERVICE} --image "$$IMAGE" --region=${_REGION}
        else
          echo "SKIP: the service '${_SERVICE}' does not exist yet."
          echo "The image was built and pushed. Create the service once from the"
          echo "console (Cloud Run -> Create service -> existing container image)"
          echo "and give it its environment variables; every later run updates it."
        fi

  # 5) The scheduled jobs. Same reasoning as above: only existing jobs are
  #    updated, because creating one requires its own environment variables,
  #    which deliberately live in the console rather than in this file.
  #    In the script below, a literal `$` is written `$$`: Cloud Build applies
  #    substitutions to every value before the shell ever sees it, so `$$IMAGE`
  #    reaches bash as `$IMAGE`. scripts/check_cloudbuild.py enforces this in CI.
  - id: update-jobs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
        for JOB in ${_MAINTENANCE_JOB} ${_RETENTION_JOB}; do
          if gcloud run jobs describe "$$JOB" --region=${_REGION} >/dev/null 2>&1; then
            gcloud run jobs update "$$JOB" --image "$$IMAGE" --region=${_REGION}
          else
            echo "SKIP: the job '$$JOB' does not exist yet (create it once from the console, with its own environment variables)."
          fi
        done

# No `images:` block on purpose. It looks like the tidy way to publish the image,
# but Cloud Build pushes those artifacts only *after* the whole build has
# succeeded -- too late for `deploy-service`, which runs during the build and needs
# the tag to be in the registry already. Step 3 pushes explicitly instead. That was
# B-007, and the symptom was `Image '...:e6a55cc' not found` on a tag that existed
# nowhere yet.
options:
  logging: CLOUD_LOGGING_ONLY
